<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#5FBFFF">
<title>Blobocracy</title>
<meta name="description" content="Everyone on the internet controls the same blob. One life. Can we beat it together?">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #5FBFFF; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #status { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font: 700 15px 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #2A1B3D; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #status.show { opacity: 1; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Blobocracy: everyone steers the same blob. Arrow keys or A and D to move, W, up or space to jump."></canvas>
<div id="status" role="status"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
