<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #5FBFFF; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #status { position: fixed; left: 0; right: 0; bottom: 64px; text-align: center; font: 700 15px 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #2A1B3D; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #status.show { opacity: 1; }
  #packed { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(42,27,61,.6); font-family: 'Atkinson Hyperlegible Next', system-ui, sans-serif; color: #2A1B3D; }
  #packed[hidden] { display: none; }
  #packed .card { background: #FFF1D6; border: 3.5px solid #2A1B3D; border-radius: 22px; box-shadow: 0 6px 0 #2A1B3D; max-width: 360px; padding: 24px 22px; text-align: center; transform: rotate(-1.5deg); }
  #packed h1 { font: 400 32px 'Bagel Fat One', system-ui, sans-serif; margin: 0 0 6px; }
  #packed .big { font: 400 54px 'Bagel Fat One', system-ui, sans-serif; color: #FFD21F; -webkit-text-stroke: 7px #2A1B3D; paint-order: stroke fill; margin: 4px 0 0; line-height: 1.1; }
  #packed p { margin: 8px 0; font-weight: 700; font-size: 16px; line-height: 1.4; }
  #packed .soft { color: rgba(42,27,61,.72); font-weight: 600; font-size: 14px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Blobocracy: everyone steers the same blob. Arrow keys or A and D to move, W, up or space to jump."></canvas>
<div id="status" role="status"></div>
<div id="announce" class="sr-only" aria-live="polite"></div>
<div id="packed" hidden role="alertdialog" aria-labelledby="packed-title" aria-describedby="packed-desc">
  <div class="card">
    <h1 id="packed-title">Blobocracy is packed</h1>
    <p id="packed-desc"><span data-online>0</span> people are steering the blob right now. It has died</p>
    <div class="big" data-deaths>0</div>
    <p>times so far.</p>
    <p class="soft">Keep this tab open: you'll be let in automatically as soon as there's room.</p>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
